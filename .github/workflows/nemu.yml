# Issue ごとの Discord スレッドを、レビュー依頼ボット NEMU（tools/review-bot）に立ててもらう。
# - Issue が開く・タイトルが変わる・閉じる・開き直す → スレッドを合わせる（sync_issue）
# - PR が開く・本文が変わる → 本文の Closes #番号 の Issue のスレッドに PR をつなぐ（link_pr）
# - 手動で動かす → 今開いている Issue のスレッドをまとめて立てる
# リポジトリのシークレット NEMU_URL（NEMU の URL、鍵入り）が要る。無ければ何もしない。

name: NEMU（Issue のスレッド）

on:
  issues:
    types: [opened, edited, closed, reopened]
  pull_request:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: nemu-${{ github.event.issue.number || github.event.pull_request.number || 'all' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEMU_URL: ${{ secrets.NEMU_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: NEMU を呼ぶ
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NEMU_URL" ]; then
            echo "シークレット NEMU_URL が無いので何もしない（フォークからの PR でも無い）"
            exit 0
          fi

          # tools/call を1回送る。引数は jq で作った JSON（Issue のタイトルや本文はシェルに通さない）
          call() {
            local name="$1" args="$2" res
            res=$(jq -n --arg name "$name" --argjson args "$args" \
              '{jsonrpc: "2.0", id: 1, method: "tools/call", params: {name: $name, arguments: $args}}' |
              curl -fsS --retry 2 -X POST "$NEMU_URL" -H 'Content-Type: application/json' \
                -H 'Accept: application/json, text/event-stream' --data-binary @-)
            echo "$res" | jq -r '.result.content[0].text // .error.message'
            if [ "$(echo "$res" | jq '.result.isError == true or has("error")')" = "true" ]; then exit 1; fi
          }

          issue_args='{url: .html_url, title: .title, state: .state, author: .user.login, body: ((.body // "")[0:2000])}'

          case "$GITHUB_EVENT_NAME" in
            issues)
              call sync_issue "$(jq --arg action "$(jq -r .action "$GITHUB_EVENT_PATH")" ".issue | $issue_args + {action: \$action}" "$GITHUB_EVENT_PATH")"
              ;;
            pull_request)
              args=$(jq '.pull_request | {url: .html_url, title: .title, author: .user.login,
                issues: [(.body // "") | scan("(?i)\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s*:?\\s+#([0-9]+)") | .[0]] | unique}' "$GITHUB_EVENT_PATH")
              if [ "$(echo "$args" | jq '.issues | length')" = "0" ]; then
                echo "本文に Closes #番号 が無いので何もしない"
                exit 0
              fi
              call link_pr "$args"
              ;;
            workflow_dispatch)
              gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
                --jq ".[] | select(.pull_request == null) | $issue_args + {action: \"opened\"}" | jq -c . |
                while IFS= read -r a; do call sync_issue "$a"; done
              ;;
          esac
